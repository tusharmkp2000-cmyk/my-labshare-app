{% extends "base.html" %}
{% block content %}
<h1>Upload a resource</h1>
<form class="stack" method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Title <input name="title" placeholder="Practical 3 - Sorting" required maxlength="120"></label>
  <label>Subject <input name="subject" list="subs" placeholder="Data Structures" required maxlength="60"></label>
  <datalist id="subs">{% for s in subjects %}<option value="{{ s }}">{% endfor %}</datalist>
  <label>File <input type="file" name="file" required></label>
  <button>Encrypt and upload</button>
  <small>pdf, doc(x), ppt(x), xls(x), txt, zip, png, jpg, mp4. Up to {{ max_mb }} MB.</small>
</form>
{% endblock %}
